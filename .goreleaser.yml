version: 2

builds:
  - main: ./cmd/loadout
    binary: loadout
    ldflags:
      - -X github.com/sethdeckard/loadout/cmd/loadout/cmd.version={{.Version}}
      - -X github.com/sethdeckard/loadout/cmd/loadout/cmd.commit={{.ShortCommit}}
      - -X github.com/sethdeckard/loadout/cmd/loadout/cmd.date={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

homebrew_casks:
  - repository:
      owner: sethdeckard
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/sethdeckard/loadout
    description: Skill manager for Claude and Codex
    directory: Casks
    binaries:
      - loadout
    # The macOS binaries are unsigned and un-notarized. Remove this hook
    # if Developer ID signing and notarization are introduced.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/loadout"]
          end

changelog:
  use: github-native
